name: Deploy Community Variant

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "variants/chiiki-junkan-community-app/**"
      - ".github/workflows/deploy-community-variant.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-community-variant"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: variants/chiiki-junkan-community-app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
